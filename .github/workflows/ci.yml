# Diagnostic branch only; do not merge this workflow into master.
name: Neighbor switch confirmation
run-name: Parent versus PR48 performance confirmation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neighbor-confirmation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observe:
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 1015e0c4058377ba43bacdf2ae791708417390cd
      - uses: actions/checkout@v7
        with:
          ref: b50e1ec0b1fdce42d6cc14fe632375202715bf26
          path: .matched-parent
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj
      - name: Check fixed revisions and matching build inputs
        shell: pwsh
        run: |
          $parent = Join-Path $env:GITHUB_WORKSPACE '.matched-parent'
          $baselineCommit = git -C $parent rev-parse HEAD
          $candidateCommit = git rev-parse HEAD
          if ($candidateCommit -cne '1015e0c4058377ba43bacdf2ae791708417390cd' -or $baselineCommit -cne 'b50e1ec0b1fdce42d6cc14fe632375202715bf26') { throw 'Unexpected revision.' }
          foreach ($file in @('Directory.Build.props', 'Directory.Packages.props', 'global.json', 'src/ModernImageViewer.App/ModernImageViewer.App.csproj', 'scripts/build-raw-native.ps1')) {
            if ((Get-FileHash $file).Hash -cne (Get-FileHash (Join-Path $parent $file)).Hash) { throw "Build input differs: $file" }
          }
          [IO.Directory]::CreateDirectory('artifacts/neighbor-confirmation') | Out-Null
          @{ Scope = 'Diagnostic only; parent versus PR48; two predetermined six-pair rounds; not release CI or P95'
             BaselineCommit = $baselineCommit; CandidateCommit = $candidateCommit; Sdk = (dotnet --version) } |
            ConvertTo-Json | Set-Content artifacts/neighbor-confirmation/provenance.json -Encoding utf8
      - name: Build one shared native bridge
        shell: pwsh
        run: |
          .\scripts\build-raw-native.ps1
          $destination = Join-Path $env:GITHUB_WORKSPACE '.matched-parent/artifacts/raw-native'
          [IO.Directory]::CreateDirectory($destination) | Out-Null
          foreach ($file in @('ModernImageViewer.RawBridge.dll', 'raw-native.json', 'licenses')) {
            Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "artifacts/raw-native/$file") -Destination $destination -Recurse
          }
      - name: Publish both fixed revisions with identical options
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          foreach ($entry in @(@{Source='.matched-parent';Label='A'}, @{Source='.';Label='B'})) {
            Push-Location (Join-Path $root $entry.Source)
            try {
              dotnet publish src/ModernImageViewer.App/ModernImageViewer.App.csproj --configuration Release --runtime win-x64 --self-contained true --output (Join-Path $root "artifacts/neighbor-packages/$($entry.Label)") -p:ContinuousIntegrationBuild=true
              if ($LASTEXITCODE -ne 0) { throw 'Comparison publish failed.' }
            }
            finally { Pop-Location }
          }
          $a = Join-Path $root 'artifacts/neighbor-packages/A'
          $b = Join-Path $root 'artifacts/neighbor-packages/B'
          $runtimeA = (Get-Content (Join-Path $a 'ModernImageViewer.App.runtimeconfig.json') -Raw | ConvertFrom-Json).runtimeOptions | ConvertTo-Json -Depth 8 -Compress
          $runtimeB = (Get-Content (Join-Path $b 'ModernImageViewer.App.runtimeconfig.json') -Raw | ConvertFrom-Json).runtimeOptions | ConvertTo-Json -Depth 8 -Compress
          if ($runtimeA -cne $runtimeB) { throw 'Bundled runtime/configuration differs.' }
          $filesA = @(Get-ChildItem -LiteralPath $a -File -Filter '*.dll')
          $filesB = @(Get-ChildItem -LiteralPath $b -File -Filter '*.dll')
          if ($filesA.Count -ne $filesB.Count) { throw 'Native file counts differ.' }
          foreach ($file in $filesA) {
            if ((Get-FileHash $file.FullName).Hash -cne (Get-FileHash (Join-Path $b $file.Name)).Hash) { throw "Native/runtime file differs: $($file.Name)" }
          }
      - name: Parent comparison round 1
        id: round1
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: >-
          .\scripts\invoke-static-comparison.ps1
          -BaselineAppPath artifacts/neighbor-packages/A/ModernImageViewer.App.exe
          -CandidateAppPath artifacts/neighbor-packages/B/ModernImageViewer.App.exe
          -Pairs 6 -WarmupPairs 1 -RequireValid
          -OutputDirectory artifacts/neighbor-confirmation/round1
      - name: Parent comparison round 2 (planned before results)
        id: round2
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: >-
          .\scripts\invoke-static-comparison.ps1
          -BaselineAppPath artifacts/neighbor-packages/A/ModernImageViewer.App.exe
          -CandidateAppPath artifacts/neighbor-packages/B/ModernImageViewer.App.exe
          -Pairs 6 -WarmupPairs 1 -RequireValid
          -OutputDirectory artifacts/neighbor-confirmation/round2
      - name: Preserve both observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: neighbor-parent-confirmation
          path: artifacts/neighbor-confirmation/**
          if-no-files-found: warn
          retention-days: 14
      - name: Retain strict result for both rounds
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.round1.outcome }}' -ne 'success' -or '${{ steps.round2.outcome }}' -ne 'success') { throw 'One or both diagnostic rounds failed or were inconclusive; inspect retained raw evidence.' }
