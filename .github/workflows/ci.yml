name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore .\ModernImageViewer.slnx

      - name: Build
        run: dotnet build .\ModernImageViewer.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test .\ModernImageViewer.slnx --configuration Release --no-build

      - name: Verify formatting
        run: dotnet format .\ModernImageViewer.slnx --verify-no-changes --no-restore
