name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish_release:
        description: '构建验证通过后发布 GitHub Release（仅 master）'
        type: boolean
        default: false
      prerelease:
        description: '发布为预发布版本（仅 publish_release=true 时生效）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Release builds must not cancel each other before their version-scoped publish lock.
  group: ${{ github.workflow }}-${{ inputs.publish_release && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.publish_release }}

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      release_version: ${{ steps.release_metadata.outputs.version }}
      release_commit: ${{ steps.release_metadata.outputs.commit }}

    steps:
      - uses: actions/checkout@v7

      - name: Check release publisher boundaries (offline)
        run: python scripts/test-publish-release.py

      - name: Validate release request and version
        id: release_metadata
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        shell: pwsh
        run: python .\scripts\publish-release.py prepare

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Show .NET information
        run: dotnet --info

      - name: Restore
        run: dotnet restore .\ModernImageViewer.slnx

      - name: Build bundled RAW preview bridge
        shell: pwsh
        run: .\scripts\build-raw-native.ps1

      - name: Verify formatting
        run: dotnet format .\ModernImageViewer.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build .\ModernImageViewer.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        env:
          MIV_FORMAT_FIXTURE_DIRECTORY: ${{ github.workspace }}\artifacts\format-fixtures
          MIV_UI_SCREENSHOT_DIRECTORY: ${{ github.workspace }}\artifacts\ui-screenshots
        run: >-
          dotnet test .\ModernImageViewer.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFilePrefix=test-results"
          --results-directory .\artifacts\test-results
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots
          path: artifacts/ui-screenshots/**
          if-no-files-found: warn
          retention-days: 14

      - name: Audit dependencies
        run: dotnet list .\ModernImageViewer.slnx package --vulnerable --include-transitive

      - name: Observe bounded 100MP codec output
        shell: pwsh
        run: .\scripts\measure-codec.ps1 -NoBuild

      - name: Upload codec observation
        uses: actions/upload-artifact@v7
        with:
          name: codec-observation
          path: artifacts/codec-observation/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Restore win-x64 runtime assets
        run: dotnet restore .\src\ModernImageViewer.App\ModernImageViewer.App.csproj --runtime win-x64

      - name: Publish win-x64
        run: >-
          dotnet publish .\src\ModernImageViewer.App\ModernImageViewer.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output .\artifacts\publish\win-x64

      - name: Check published application startup
        shell: pwsh
        run: >-
          .\scripts\measure-startup.ps1
          -AppPath .\artifacts\publish\win-x64\ModernImageViewer.App.exe
          -Iterations 1
          -ObservationSeconds 1
          -OutputPath .\artifacts\startup-results.json

      - name: Upload startup observation
        uses: actions/upload-artifact@v7
        with:
          name: startup-observation
          path: artifacts/startup-results.json
          if-no-files-found: error
          retention-days: 14

      - name: Check published application file activation
        shell: pwsh
        run: >-
          .\scripts\check-file-activation.ps1
          -AppPath .\artifacts\publish\win-x64\ModernImageViewer.App.exe
          -FixtureDirectory .\artifacts\format-fixtures

      - name: Observe browsing phases and continuity smoke
        shell: pwsh
        run: >-
          .\scripts\measure-browsing.ps1
          -AppPath .\artifacts\publish\win-x64\ModernImageViewer.App.exe
          -GeneratedImageCount 8 -NeighborSwitches 8 -RapidBurst 4
          -RefreshEvery 4 -DetailEvery 4 -IdleSeconds 2

      - name: Upload browsing observation
        uses: actions/upload-artifact@v7
        with:
          name: browsing-observation
          path: artifacts/browsing-observation/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Observe animation and multipage lifecycle smoke
        shell: pwsh
        run: >-
          .\scripts\measure-animation.ps1
          -AppPath .\artifacts\publish\win-x64\ModernImageViewer.App.exe
          -FixtureDirectory .\artifacts\format-fixtures
          -Loops 1 -LongSeconds 1 -TimeoutSeconds 240 -RequireInstrumentation

      - name: Upload animation observation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: animation-observation
          path: artifacts/animation-observation/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Build win-x64 installer
        id: installer_build
        shell: pwsh
        run: .\scripts\build-installer.ps1 -SkipPublish

      - name: Check out fixed 0.5 baseline for real upgrade verification
        uses: actions/checkout@v7
        with:
          ref: 9cdcde9cffc4be3a242f30da2828dfb8c7ab910f
          path: .baseline-0.5
          persist-credentials: false

      - name: Build actual 0.5 baseline installer
        shell: pwsh
        run: |
          $repository = $env:GITHUB_WORKSPACE
          $baseline = Join-Path $repository '.baseline-0.5'
          [xml]$baselineProperties = Get-Content (Join-Path $baseline 'Directory.Build.props') -Raw
          [xml]$targetProperties = Get-Content (Join-Path $repository 'Directory.Build.props') -Raw
          if ([string]$baselineProperties.Project.PropertyGroup.Version -ne '0.5.0' -or
              [string]$targetProperties.Project.PropertyGroup.Version -ne '0.6.0') {
            throw 'Real upgrade verification requires the unchanged 0.5.0 baseline and a 0.6.0 target.'
          }
          # Each checkout resolves native content relative to its own artifacts directory.
          # The baseline script revalidates archive, source, compiler and bridge hashes.
          $baselineNative = Join-Path $baseline 'artifacts/raw-native'
          [IO.Directory]::CreateDirectory($baselineNative) | Out-Null
          foreach ($name in @('ModernImageViewer.RawBridge.dll', 'raw-native.json', 'LibRaw-0.22.2-Win64.zip', 'licenses')) {
            Copy-Item -LiteralPath (Join-Path $repository "artifacts/raw-native/$name") -Destination $baselineNative -Recurse
          }
          Push-Location $baseline
          try {
            & .\scripts\build-installer.ps1 -PublishDirectory (Join-Path $repository 'artifacts/baseline-0.5/publish') -OutputDirectory (Join-Path $repository 'artifacts/baseline-0.5/installer')
          }
          finally { Pop-Location }

      - name: Observe fixed 0.5 baseline in the same Windows job
        shell: pwsh
        run: |
          $baselineApp = Join-Path $env:GITHUB_WORKSPACE 'artifacts/baseline-0.5/publish/ModernImageViewer.App.exe'
          .\scripts\measure-startup.ps1 -AppPath $baselineApp -Iterations 1 -ObservationSeconds 1 -OutputPath .\artifacts\startup-baseline-0.5.json
          .\scripts\measure-browsing.ps1 -AppPath $baselineApp -GeneratedImageCount 8 -NeighborSwitches 8 -RapidBurst 4 -RefreshEvery 4 -DetailEvery 4 -IdleSeconds 2 -OutputPath .\artifacts\browsing-observation\baseline-0.5.json

      - name: Upload baseline static observations
        uses: actions/upload-artifact@v7
        with:
          name: baseline-static-observation
          path: |
            artifacts/startup-baseline-0.5.json
            artifacts/browsing-observation/baseline-0.5.json
          if-no-files-found: error
          retention-days: 14

      - name: Check actual 0.5 to 0.6 upgrade, reinstall and uninstall
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem .\artifacts\installer\*-Setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer.' }
          $baselineInstallers = @(Get-ChildItem .\artifacts\baseline-0.5\installer\*-Setup.exe)
          if ($baselineInstallers.Count -ne 1) { throw 'Expected exactly one unchanged 0.5 installer.' }
          .\scripts\check-installer.ps1 -InstallerPath $installers[0].FullName -BaselineInstallerPath $baselineInstallers[0].FullName -FixtureDirectory .\artifacts\format-fixtures

      - name: Upload win-x64 installer
        if: always() && steps.installer_build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ModernImageViewer-Setup-win-x64
          path: artifacts/installer/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload installer verification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installer-verification
          path: artifacts/installer-smoke/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload win-x64 application
        uses: actions/upload-artifact@v7
        with:
          name: ModernImageViewer-win-x64
          path: artifacts/publish/win-x64/**
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish verified GitHub Release
    needs: build-test-publish
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.build-test-publish.outputs.release_version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build-test-publish.outputs.release_commit }}

      - name: Download verified installer and portable package
        uses: actions/download-artifact@v8
        with:
          name: ModernImageViewer-Setup-win-x64
          path: artifacts/installer

      - name: Publish immutable version assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build-test-publish.outputs.release_version }}
          RELEASE_COMMIT: ${{ needs.build-test-publish.outputs.release_commit }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: >-
          python scripts/publish-release.py publish
          --version "$RELEASE_VERSION"
          --commit "$RELEASE_COMMIT"
          --prerelease "$RELEASE_PRERELEASE"
          --assets artifacts/installer
