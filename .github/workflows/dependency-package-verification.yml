name: Dependency package verification
on:
  push:
    branches: [test/dependency-package-validation]
permissions:
  actions: read
  contents: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c54399b4c157860b3336e6204426880f3c61f666
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj
      - name: Download pinned artifact 14514547180
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP '14514547180.zip'
          gh api 'repos/${{ github.repository }}/actions/artifacts/14514547180/zip' > $archive
          if ($LASTEXITCODE -ne 0) { throw 'Pinned artifact download failed.' }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ine '4b674d753e0db91405fc201bb582c6919091b9e7731cda2a702de1bb0f5d2d3d') { throw 'Pinned artifact digest mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath 'artifacts/ci-package'
      - name: Verify and extract the pinned CI candidate
        shell: pwsh
        run: |
          $portable = Get-Item -LiteralPath artifacts/ci-package/ModernImageViewer-0.6.2-win-x64-Portable.zip
          $expected = ((Get-Content -LiteralPath "$($portable.FullName).sha256" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash -LiteralPath $portable.FullName -Algorithm SHA256).Hash -ine $expected) { throw 'Candidate portable digest mismatch.' }
          Expand-Archive -LiteralPath $portable.FullName -DestinationPath artifacts/ci-candidate
          $candidate = 'artifacts/ci-candidate/app/ModernImageViewer.App.exe'
          if ((Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash -cne '8F76825A7571EB1F3DBCD48166B66AF0AC49D449152DB852C4763D92113D8387') { throw 'Candidate executable digest mismatch.' }
      - name: Build bundled RAW preview bridge
        shell: pwsh
        run: .\scripts\build-raw-native.ps1
      - name: Publish same-source flat comparison package
        timeout-minutes: 5
        shell: pwsh
        run: |
          dotnet publish .\src\ModernImageViewer.App\ModernImageViewer.App.csproj --configuration Release --runtime win-x64 --self-contained true --output .\artifacts\packaging-flat-comparison -p:PublishSingleFile=false -p:EnableCompressionInSingleFile=false
          if ($LASTEXITCODE -ne 0) { throw 'Flat comparison publish failed.' }
          $candidate = Get-Item -LiteralPath artifacts/ci-candidate/app/ModernImageViewer.App.exe
          $flat = Get-Item -LiteralPath artifacts/packaging-flat-comparison/ModernImageViewer.App.exe
          if ($flat.VersionInfo.ProductVersion -cne $candidate.VersionInfo.ProductVersion) { throw 'Packaging comparison source revision mismatch.' }
      - name: Preserve child diagnostics when the comparison report is missing
        shell: pwsh
        run: |
          $path = 'scripts/measure-static-comparison.ps1'
          $original = Get-Content -LiteralPath $path -Raw
          $marker = '(?m)^        \[void\]\$stderr\.GetAwaiter\(\)\.GetResult\(\)\r?$'
          if ([regex]::Matches($original, $marker).Count -ne 1) { throw 'Comparison harness revision mismatch.' }
          $diagnostic = @'
          $childError = $stderr.GetAwaiter().GetResult()
          if (-not [IO.File]::Exists($ReportPath)) {
              $message = "Driver exited with code $($process.ExitCode).`n$childError"
              [IO.File]::WriteAllText("$ReportPath.diagnostic.txt", $message)
          }
          '@
          $instrumented = [regex]::Replace($original, $marker, { $diagnostic })
          $catch = '(?m)^    catch \{ \$failure = Get-StableFailure \$_ \}\r?$'
          if ([regex]::Matches($instrumented, $catch).Count -ne 1) { throw 'Comparison observer revision mismatch.' }
          $diagnosticCatch = @'
              catch {
                  $failure = Get-StableFailure $_
                  $message = "Observer exception: $($_.Exception.GetType().FullName)`n$($_.Exception.Message)`n$($_.ScriptStackTrace)"
                  [IO.File]::WriteAllText("$ReportPath.observer.txt", $message)
              }
          '@
          [regex]::Replace($instrumented, $catch, { $diagnosticCatch }) | Set-Content -LiteralPath $path -NoNewline
      - name: Compare flat and single-file packaging performance
        timeout-minutes: 12
        shell: pwsh
        run: |
          .\scripts\invoke-static-comparison.ps1 -BaselineAppPath .\artifacts\packaging-flat-comparison\ModernImageViewer.App.exe -CandidateAppPath .\artifacts\ci-candidate\app\ModernImageViewer.App.exe -Pairs 6 -WarmupPairs 1 -OutputDirectory .\artifacts\packaging\static-comparison -RequireValid
      - name: Upload packaging verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-packaging-verification
          path: artifacts/packaging/**
          if-no-files-found: warn
          retention-days: 14
