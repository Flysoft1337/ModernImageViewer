name: Dependency installer verification

on:
  push:
    branches: [test/dependency-installer-validation]

permissions:
  actions: read
  contents: read

jobs:
  installer-public-04:
    name: Verify public 0.4 upgrade in an isolated Windows VM
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: bdb6dc4aaeac33d0616d6b64280857866ecf8f3f
          persist-credentials: false
      - name: Download pinned artifact 14514547180
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP '14514547180.zip'
          gh api 'repos/${{ github.repository }}/actions/artifacts/14514547180/zip' > $archive
          if ($LASTEXITCODE -ne 0) { throw 'Pinned artifact download failed.' }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ine '4b674d753e0db91405fc201bb582c6919091b9e7731cda2a702de1bb0f5d2d3d') { throw 'Pinned artifact digest mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath 'artifacts/installer'
      - name: Download pinned artifact 14513934743
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP '14513934743.zip'
          gh api 'repos/${{ github.repository }}/actions/artifacts/14513934743/zip' > $archive
          if ($LASTEXITCODE -ne 0) { throw 'Pinned artifact download failed.' }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ine 'b82e461bafca4a1f6f3db8b070d5f9bfdcaeadbfae0c25d414a2eae6bb23f4f4') { throw 'Pinned artifact digest mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath 'artifacts/format-fixtures'
      - name: Download and verify public v0.4.0 upgrade baseline
        shell: pwsh
        run: |
          $name = 'ModernImageViewer-0.4.0-win-x64-Setup.exe'
          $source = 'https://github.com/Flysoft1337/ModernImageViewer/releases/download/v0.4.0'
          $expectedSha256 = 'bc645e8cd2a4ebadeb10b4a8a3698be6045f2643f7311a9bbf673476d9ae55b6'
          $directory = Join-Path $env:GITHUB_WORKSPACE 'artifacts/baseline-0.4'
          [IO.Directory]::CreateDirectory($directory) | Out-Null
          $installer = Join-Path $directory $name
          $checksumPath = "$installer.sha256"
          Invoke-WebRequest -Uri "$source/$name.sha256" -OutFile $checksumPath -TimeoutSec 180
          $checksum = [regex]::Match((Get-Content -LiteralPath $checksumPath -Raw), '\A([0-9a-f]{64})  ([^\r\n]+)\r?\n?\z')
          if (-not $checksum.Success -or $checksum.Groups[1].Value -cne $expectedSha256 -or $checksum.Groups[2].Value -cne $name) {
            throw 'The public v0.4.0 checksum must match the pinned SHA256 and exact installer filename.'
          }
          Invoke-WebRequest -Uri "$source/$name" -OutFile $installer -TimeoutSec 180
          $sha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-Item -LiteralPath $installer).Length -ne 56037592 -or $sha256 -cne $expectedSha256) {
            throw 'The public v0.4.0 installer size or SHA256 does not match the pinned release asset.'
          }
          $versionInfo = [Diagnostics.FileVersionInfo]::GetVersionInfo($installer)
          # Inno Setup stores AppVersion in the padded ProductVersion resource.
          if ($versionInfo.ProductVersion.Trim() -cne '0.4.0' -or $versionInfo.ProductName.Trim() -cne 'Modern Image Viewer') {
            throw 'The public baseline installer must identify Modern Image Viewer version 0.4.0.'
          }
          $logs = Join-Path $env:GITHUB_WORKSPACE 'artifacts/installer-smoke'
          [IO.Directory]::CreateDirectory($logs) | Out-Null
          [pscustomobject]@{
            Source = "$source/$name"
            ChecksumSource = "$source/$name.sha256"
            Sha256 = $sha256
            Bytes = (Get-Item -LiteralPath $installer).Length
            InstallerProductVersion = $versionInfo.ProductVersion.Trim()
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $logs 'baseline-package.json') -Encoding utf8

      - name: Start verification and pause before baseline setup
        shell: pwsh
        run: |
          $logs = Join-Path $env:GITHUB_WORKSPACE 'artifacts/installer-smoke'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/check-installer.ps1'
          $source = Get-Content -LiteralPath $script -Raw
          $marker = "    Write-InstallerCheckpoint 'InitialInstall'"
          if ([regex]::Matches($source, [regex]::Escape($marker)).Count -ne 1) { throw 'Expected one baseline setup checkpoint.' }
          $pause = @'
              $gateDeadline = [DateTimeOffset]::UtcNow.AddMinutes(2)
              while (-not (Test-Path -LiteralPath (Join-Path $logs 'start-baseline')) -and [DateTimeOffset]::UtcNow -lt $gateDeadline) {
                  Start-Sleep -Milliseconds 250
              }
              if (-not (Test-Path -LiteralPath (Join-Path $logs 'start-baseline'))) { throw 'Missing baseline start signal.' }
          '@
          $instrumented = Join-Path $env:GITHUB_WORKSPACE 'scripts/check-installer-diagnostic.ps1'
          $source.Replace($marker, ($marker + [Environment]::NewLine + $pause)) | Set-Content -LiteralPath $instrumented -Encoding utf8
          $worker = Join-Path $env:RUNNER_TEMP 'run-installer-check.ps1'
          @'
          $ErrorActionPreference = 'Stop'
          $logs = Join-Path $env:GITHUB_WORKSPACE 'artifacts/installer-smoke'
          Set-Location -LiteralPath $env:GITHUB_WORKSPACE
          try {
              $installers = @(Get-ChildItem .\artifacts\installer\*-Setup.exe)
              if ($installers.Count -ne 1) { throw 'Expected exactly one installer.' }
              .\scripts\check-installer-diagnostic.ps1 -InstallerPath $installers[0].FullName -BaselineInstallerPath .\artifacts\baseline-0.4\ModernImageViewer-0.4.0-win-x64-Setup.exe -BaselineVersion 0.4.0 -FixtureDirectory .\artifacts\format-fixtures
              Set-Content -LiteralPath (Join-Path $logs 'worker-result.txt') -Value 'success'
          } catch {
              Set-Content -LiteralPath (Join-Path $logs 'worker-result.txt') -Value 'failure'
              throw
          }
          '@ | Set-Content -LiteralPath $worker -Encoding utf8
          Start-Process -FilePath (Get-Process -Id $PID).Path -ArgumentList @('-NoLogo', '-NoProfile', '-NonInteractive', '-File', ('"{0}"' -f $worker)) -WindowStyle Hidden -RedirectStandardOutput (Join-Path $logs 'worker-stdout.txt') -RedirectStandardError (Join-Path $logs 'worker-stderr.txt')
          $checkpoint = Join-Path $logs 'checkpoint.json'
          $deadline = [DateTimeOffset]::UtcNow.AddSeconds(20)
          do {
              Start-Sleep -Milliseconds 250
              $stage = if (Test-Path -LiteralPath $checkpoint) { (Get-Content -LiteralPath $checkpoint -Raw | ConvertFrom-Json).Stage }
          } until ($stage -eq 'InitialInstall' -or (Test-Path -LiteralPath (Join-Path $logs 'worker-result.txt')) -or [DateTimeOffset]::UtcNow -ge $deadline)
          Write-Host "Last checkpoint before baseline setup: $stage"

      - name: Save pre-install checkpoint
        uses: actions/upload-artifact@v7
        with:
          name: installer-before-baseline
          path: artifacts/installer-smoke/**
          if-no-files-found: error
          retention-days: 14

      - name: Start public baseline install and capture early progress
        shell: pwsh
        run: |
          $logs = Join-Path $env:GITHUB_WORKSPACE 'artifacts/installer-smoke'
          New-Item -ItemType File -Path (Join-Path $logs 'start-baseline') | Out-Null
          Start-Sleep -Seconds 12
          $checkpoint = Join-Path $logs 'checkpoint.json'
          if (Test-Path -LiteralPath $checkpoint) { Get-Content -LiteralPath $checkpoint }

      - name: Save early installer progress
        uses: actions/upload-artifact@v7
        with:
          name: installer-after-baseline-start
          path: artifacts/installer-smoke/**
          if-no-files-found: error
          retention-days: 14

      - name: Read installer verification result
        timeout-minutes: 5
        shell: pwsh
        run: |
          $logs = Join-Path $env:GITHUB_WORKSPACE 'artifacts/installer-smoke'
          $result = Join-Path $logs 'worker-result.txt'
          $deadline = [DateTimeOffset]::UtcNow.AddMinutes(4)
          while (-not (Test-Path -LiteralPath $result) -and [DateTimeOffset]::UtcNow -lt $deadline) {
              Start-Sleep -Seconds 1
          }
          Get-Content -LiteralPath (Join-Path $logs 'worker-stdout.txt'), (Join-Path $logs 'worker-stderr.txt')
          if (-not (Test-Path -LiteralPath $result)) { throw 'Installer worker reached its observation deadline.' }
          if ((Get-Content -LiteralPath $result -Raw).Trim() -ne 'success') { throw 'Installer worker failed.' }
          $report = Get-Content -LiteralPath (Join-Path $logs 'lifecycle.json') -Raw | ConvertFrom-Json
          if (-not ($report.Success -and $report.CrossVersionUpgradeVerified -and $report.CleanupSucceeded)) { throw 'Installer lifecycle is incomplete.' }

      - name: Upload installer verification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installer-verification
          path: artifacts/installer-smoke/**
          if-no-files-found: warn
          retention-days: 14
