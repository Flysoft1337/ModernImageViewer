name: Dependency installer verification

on:
  push:
    branches: [test/dependency-installer-validation]

permissions:
  actions: read
  contents: read

jobs:
  installer-public-04:
    name: Verify public 0.4 upgrade in an isolated Windows VM
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: bdb6dc4aaeac33d0616d6b64280857866ecf8f3f
          persist-credentials: false
      - name: Download pinned artifact 14514547180
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP '14514547180.zip'
          gh api 'repos/${{ github.repository }}/actions/artifacts/14514547180/zip' > $archive
          if ($LASTEXITCODE -ne 0) { throw 'Pinned artifact download failed.' }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ine '4b674d753e0db91405fc201bb582c6919091b9e7731cda2a702de1bb0f5d2d3d') { throw 'Pinned artifact digest mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath 'artifacts/installer'
      - name: Download pinned artifact 14513934743
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP '14513934743.zip'
          gh api 'repos/${{ github.repository }}/actions/artifacts/14513934743/zip' > $archive
          if ($LASTEXITCODE -ne 0) { throw 'Pinned artifact download failed.' }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ine 'b82e461bafca4a1f6f3db8b070d5f9bfdcaeadbfae0c25d414a2eae6bb23f4f4') { throw 'Pinned artifact digest mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath 'artifacts/format-fixtures'
      - name: Download and verify public v0.4.0 upgrade baseline
        shell: pwsh
        run: |
          $name = 'ModernImageViewer-0.4.0-win-x64-Setup.exe'
          $source = 'https://github.com/Flysoft1337/ModernImageViewer/releases/download/v0.4.0'
          $expectedSha256 = 'bc645e8cd2a4ebadeb10b4a8a3698be6045f2643f7311a9bbf673476d9ae55b6'
          $directory = Join-Path $env:GITHUB_WORKSPACE 'artifacts/baseline-0.4'
          [IO.Directory]::CreateDirectory($directory) | Out-Null
          $installer = Join-Path $directory $name
          $checksumPath = "$installer.sha256"
          Invoke-WebRequest -Uri "$source/$name.sha256" -OutFile $checksumPath -TimeoutSec 180
          $checksum = [regex]::Match((Get-Content -LiteralPath $checksumPath -Raw), '\A([0-9a-f]{64})  ([^\r\n]+)\r?\n?\z')
          if (-not $checksum.Success -or $checksum.Groups[1].Value -cne $expectedSha256 -or $checksum.Groups[2].Value -cne $name) {
            throw 'The public v0.4.0 checksum must match the pinned SHA256 and exact installer filename.'
          }
          Invoke-WebRequest -Uri "$source/$name" -OutFile $installer -TimeoutSec 180
          $sha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-Item -LiteralPath $installer).Length -ne 56037592 -or $sha256 -cne $expectedSha256) {
            throw 'The public v0.4.0 installer size or SHA256 does not match the pinned release asset.'
          }
          $versionInfo = [Diagnostics.FileVersionInfo]::GetVersionInfo($installer)
          # Inno Setup stores AppVersion in the padded ProductVersion resource.
          if ($versionInfo.ProductVersion.Trim() -cne '0.4.0' -or $versionInfo.ProductName.Trim() -cne 'Modern Image Viewer') {
            throw 'The public baseline installer must identify Modern Image Viewer version 0.4.0.'
          }
          $logs = Join-Path $env:GITHUB_WORKSPACE 'artifacts/installer-smoke'
          [IO.Directory]::CreateDirectory($logs) | Out-Null
          [pscustomobject]@{
            Source = "$source/$name"
            ChecksumSource = "$source/$name.sha256"
            Sha256 = $sha256
            Bytes = (Get-Item -LiteralPath $installer).Length
            InstallerProductVersion = $versionInfo.ProductVersion.Trim()
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $logs 'baseline-package.json') -Encoding utf8

      - name: Check public 0.4 to 0.6.2 upgrade, reinstall and uninstall
        timeout-minutes: 5
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem .\artifacts\installer\*-Setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer.' }
          .\scripts\check-installer.ps1 -InstallerPath $installers[0].FullName -BaselineInstallerPath .\artifacts\baseline-0.4\ModernImageViewer-0.4.0-win-x64-Setup.exe -BaselineVersion 0.4.0 -FixtureDirectory .\artifacts\format-fixtures

      - name: Upload installer verification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installer-verification
          path: artifacts/installer-smoke/**
          if-no-files-found: warn
          retention-days: 14

  installer-public-06:
    name: Verify public 0.6.1 upgrade in an isolated Windows VM
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: bdb6dc4aaeac33d0616d6b64280857866ecf8f3f
          persist-credentials: false
      - name: Download pinned artifact 14514547180
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP '14514547180.zip'
          gh api 'repos/${{ github.repository }}/actions/artifacts/14514547180/zip' > $archive
          if ($LASTEXITCODE -ne 0) { throw 'Pinned artifact download failed.' }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ine '4b674d753e0db91405fc201bb582c6919091b9e7731cda2a702de1bb0f5d2d3d') { throw 'Pinned artifact digest mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath 'artifacts/installer'
      - name: Download pinned artifact 14513934743
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP '14513934743.zip'
          gh api 'repos/${{ github.repository }}/actions/artifacts/14513934743/zip' > $archive
          if ($LASTEXITCODE -ne 0) { throw 'Pinned artifact download failed.' }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ine 'b82e461bafca4a1f6f3db8b070d5f9bfdcaeadbfae0c25d414a2eae6bb23f4f4') { throw 'Pinned artifact digest mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath 'artifacts/format-fixtures'
      - name: Download and verify public v0.6.1 upgrade baseline
        timeout-minutes: 5
        shell: pwsh
        run: |
          $directory = Join-Path $env:GITHUB_WORKSPACE 'artifacts/baseline-0.6.1-public'
          [IO.Directory]::CreateDirectory($directory) | Out-Null
          $name = 'ModernImageViewer-0.6.1-win-x64-Setup.exe'
          $path = Join-Path $directory $name
          Write-Host "Downloading pinned public baseline: $name."
          curl.exe --fail --location --connect-timeout 30 --max-time 180 --output $path ('https://github.com/Flysoft1337/ModernImageViewer/releases/download/v0.6.1/' + $name)
          if ($LASTEXITCODE -ne 0) { throw 'Public 0.6.1 baseline download failed.' }
          if ((Get-Item -LiteralPath $path).Length -ne 61872144 -or
              (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ine '2f1130974ec61d583f5b56e57e18ed9fb382a707a49b10ba1a271fcab5df1ba3') {
            throw 'Public 0.6.1 baseline asset size/checksum mismatch.'
          }
          Write-Host 'Public 0.6.1 baseline size and SHA256 verified.'
      - name: Check public 0.6.1 to 0.6.2 upgrade, reinstall and uninstall
        timeout-minutes: 5
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem .\artifacts\installer\*-Setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer.' }
          .\scripts\check-installer.ps1 -InstallerPath $installers[0].FullName -BaselineInstallerPath .\artifacts\baseline-0.6.1-public\ModernImageViewer-0.6.1-win-x64-Setup.exe -BaselineVersion 0.6.1 -FixtureDirectory .\artifacts\format-fixtures -LogDirectory .\artifacts\installer-smoke-0.6.1
      - name: Upload public 0.6 installer verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installer-verification-0.6.1
          path: artifacts/installer-smoke-0.6.1/**
          if-no-files-found: warn
          retention-days: 14
